[package]
name = "mcp"
version = "0.1.0"
edition = "2024"

[dependencies]

serde = { version = "1.0.228", features= ["derive"]}
serde_json = "1.0.150"

# Our internal crates
storage = { path = "../storage" }
query = { path = "../query" }
semantic = { path = "../semantic" }
analytics = { path = "../analytics" }
resolver = { path = "../resolver" }
indexer = { path = "../indexer" }
runtime = { path = "../runtime" }
chrono = "0.4.45"
rusqlite = "0.40.1"

[dev-dependencies]
graph = { path = "../graph" }

[[bin]]
name = "codebroker-mcp"
path = "src/main.rs"
