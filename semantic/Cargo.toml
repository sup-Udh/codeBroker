[package]
name = "semantic"
version = "0.1.0"
edition = "2024"

[dependencies]
query = { path = "../query" }
storage = { path = "../storage" }
indexer = { path = "../indexer" }
resolver = { path = "../resolver" }

serde = { version = "1.0.228", features= ["derive"]}
serde_json = "1.0.150"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-webpki-roots", "gzip"] }
rusqlite = "0.40.1"
sha2 = "0.10.8"
toml = "0.8"
fastembed = { version = "5", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }

[dev-dependencies]
graph = { path = "../graph" }
