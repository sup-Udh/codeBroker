[package]
name = "semantic"
version = "0.1.0"
edition = "2024"

[dependencies]
query = { path = "../query" }
storage = { path = "../storage" }
indexer = { path = "../indexer" }

serde = { version = "1.0.228", features= ["derive"]}
serde_json = "1.0.150"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-webpki-roots", "gzip"] }
rusqlite = "0.40.1"

[dev-dependencies]
graph = { path = "../graph" }
